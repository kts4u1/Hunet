name: Windows EXE 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt pyinstaller

      - name: 가짜 사이트로 동작 테스트 (Microsoft Edge)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_flow.py

      - name: EXE 만들기
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HunetAutoStudy main.py

      - uses: actions/upload-artifact@v4
        with:
          name: HunetAutoStudy-windows
          path: dist/HunetAutoStudy.exe
